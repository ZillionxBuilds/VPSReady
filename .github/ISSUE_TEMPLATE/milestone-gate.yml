name: Major milestone gate
description: Create a blind milestone or release-readiness gate.
title: "[GATE] "
body:
  - type: input
    id: parent
    attributes:
      label: Parent release/milestone
      placeholder: "Mapped tracker URL from middleman/repository-migration/identity-map.json"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Gate scope and included issues
    validations:
      required: true
  - type: checkboxes
    id: evidence
    attributes:
      label: Required blind evidence
      options:
        - label: E0 static checks complete
        - label: E1 unit checks complete
        - label: E2 stateful simulation/fault injection complete
        - label: E3 local protocol complete or explicitly NOT RUN with reason
        - label: E4 packaging/host evidence complete when applicable
        - label: Diagnostics/redaction evidence complete
        - label: REAL VPS explicitly marked NOT TESTED before Owner stage
  - type: textarea
    id: manual
    attributes:
      label: Simulated Manual QA charter and result
      description: Name local platforms/scenario IDs. Never claim E5.
  - type: textarea
    id: principal
    attributes:
      label: Principal decision
      placeholder: BLIND_PHASE_APPROVED or PRINCIPAL_CHANGES_REQUESTED with rationale.
  - type: textarea
    id: risks
    attributes:
      label: Unresolved risks and Owner-test focus
    validations:
      required: true
