name: Bug report
description: Record a reproducible VPSReady defect or regression.
title: "[BUG] "
body:
  - type: input
    id: parent
    attributes:
      label: Related card/milestone/release
      placeholder: "#123"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary and impact
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: VPSReady commit/version, local OS/RID, Ubuntu version, test target type.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Logs/screenshots/CI links with passwords, keys, tokens, and unnecessary IPs removed.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - P0 — security/data-loss/lockout/release blocker
        - P1 — major workflow unavailable
        - P2 — normal defect
        - P3 — minor/cosmetic/follow-up
    validations:
      required: true
