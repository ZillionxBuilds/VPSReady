name: Research decision
description: Investigate a focused question using primary evidence and produce a decision recommendation.
title: "[RESEARCH] "
body:
  - type: input
    id: plan_id
    attributes:
      label: Plan ID
      placeholder: R401
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: Parent issue
      placeholder: "#123"
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Decision question
      description: One precise question this research must resolve.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and constraints
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Required evidence
      description: Prefer official docs, standards, upstream repositories/releases, and reproducible experiments.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Required output
      placeholder: Findings, alternatives, recommendation, risks, affected cards, and decision owner.
    validations:
      required: true
