name: Work card
description: Create one independently assignable blind-development implementation or engineering card.
title: "[CARD] "
body:
  - type: markdown
    attributes:
      value: |
        Link one parent milestone and one primary owner/workspace.
        Development has no real VPS. Progress belongs in one persistent `## Codex Workpad`.
  - type: input
    id: plan_id
    attributes:
      label: Plan ID
      description: ID from the active ExecPlan, for example C203.
      placeholder: C203
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: Parent milestone/tracking issue
      placeholder: "#123"
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: One concrete user or engineering result.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: In scope
      description: Behavior, files and components included.
    validations:
      required: true
  - type: textarea
    id: non_scope
    attributes:
      label: Out of scope
      description: Explicit boundaries that prevent scope drift.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: One observable/testable criterion per checklist item.
      placeholder: |
        - [ ] AC1 ...
        - [ ] AC2 ...
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and blockers
      placeholder: "Blocked by #...; none otherwise. Expected lack of a VPS is not a blocker."
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Highest risk
      options:
        - Low
        - Cross-platform
        - Security or privacy
        - SSH/firewall lockout
        - Destructive or recovery
    validations:
      required: true
  - type: checkboxes
    id: evidence_classes
    attributes:
      label: Expected evidence classes
      options:
        - label: E0 — Static/build/analyzer/supply-chain
        - label: E1 — Unit
        - label: E2 — Stateful simulation/fault injection
        - label: E3 — Local-contained protocol when applicable
        - label: E4 — Packaging/actual local host when applicable
        - label: E5 — Owner real VPS; must remain NOT TESTED before release Owner stage
  - type: textarea
    id: validation
    attributes:
      label: Expected validation
      description: Exact tests, scenario IDs, local protocol/host environments, and PASS/FAIL/NOT RUN evidence. Do not request a VPS.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics and redaction impact
      description: Event/command/error IDs, correlation, output policy, Activity/journal/report/bundle tests, or explicit N/A.
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Intended role owner
      placeholder: Developer / QA Automation / Orchestrator
    validations:
      required: true
