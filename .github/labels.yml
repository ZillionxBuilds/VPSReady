labels:
  - name: "type:tracking"
    color: "5319E7"
    description: "Release or initiative tracking issue"
  - name: "type:milestone"
    color: "1D76DB"
    description: "Major delivery milestone or gate"
  - name: "type:card"
    color: "0E8A16"
    description: "Independently assignable implementation card"
  - name: "type:bug"
    color: "D73A4A"
    description: "Defect or regression"
  - name: "type:research"
    color: "C5DEF5"
    description: "Focused research or technical decision"
  - name: "type:governance"
    color: "BFDADC"
    description: "Workflow, policy, planning, or harness change"
  - name: "type:release"
    color: "6F42C1"
    description: "Release preparation or Owner VPS-test activity"

  - name: "status:backlog"
    color: "EDEDED"
    description: "Not yet eligible for assignment"
  - name: "status:ready"
    color: "C2E0C6"
    description: "Dependencies satisfied and ready to claim"
  - name: "status:in-progress"
    color: "FBCA04"
    description: "Actively owned work"
  - name: "status:orchestrator-review"
    color: "BFDADC"
    description: "Waiting for Orchestrator readiness/integration check"
  - name: "status:qa-automation"
    color: "0052CC"
    description: "In independent blind automated QA"
  - name: "status:qa-failed"
    color: "B60205"
    description: "Automated QA failed; correction required"
  - name: "status:manual-qa"
    color: "D4C5F9"
    description: "In simulated major-milestone Manual QA"
  - name: "status:principal-gate"
    color: "7057FF"
    description: "Waiting for Principal milestone/final decision"
  - name: "status:blocked"
    color: "000000"
    description: "Cannot proceed; Workpad names exact unblock action"
  - name: "status:blind-verified"
    color: "0E8A16"
    description: "Applicable E0-E4 checks pass; real VPS not tested"
  - name: "status:accepted"
    color: "0E8A16"
    description: "Accepted at applicable internal level"
  - name: "status:milestone-gate"
    color: "006B75"
    description: "Milestone candidate awaiting blind outer gate"
  - name: "status:blind-phase-approved"
    color: "2DA44E"
    description: "Principal approved milestone from blind evidence"
  - name: "status:ready-owner-vps"
    color: "BFD4F2"
    description: "Principal-created candidate ready for Owner real-VPS test"
  - name: "status:owner-vps-testing"
    color: "0969DA"
    description: "Owner is validating exact release candidate on real VPS"
  - name: "status:owner-vps-failed"
    color: "B60205"
    description: "Owner real-VPS validation found a failure"
  - name: "status:ready-owner-retest"
    color: "D4C5F9"
    description: "Blind-fixed candidate ready for Owner VPS retest"
  - name: "status:owner-vps-passed"
    color: "1A7F37"
    description: "Owner real-VPS test stages passed"
  - name: "status:owner-approved"
    color: "0E8A16"
    description: "Owner explicitly approved stable promotion"

  - name: "role:orchestrator"
    color: "F9D0C4"
    description: "Current owner is Orchestrator"
  - name: "role:developer"
    color: "D93F0B"
    description: "Current owner is a Developer"
  - name: "role:researcher"
    color: "C5DEF5"
    description: "Current owner is Researcher"
  - name: "role:qa-automation"
    color: "0052CC"
    description: "Current owner is QA Automation"
  - name: "role:qa-manual"
    color: "D4C5F9"
    description: "Current owner is QA Manual"
  - name: "role:principal"
    color: "5319E7"
    description: "Current owner is Principal/Owner Representative"
  - name: "role:owner"
    color: "FFD33D"
    description: "Current action belongs to Owner"

  - name: "priority:p0"
    color: "B60205"
    description: "Immediate security/lockout/data-loss/release blocker"
  - name: "priority:p1"
    color: "D93F0B"
    description: "High priority"
  - name: "priority:p2"
    color: "FBCA04"
    description: "Normal priority"
  - name: "priority:p3"
    color: "C2E0C6"
    description: "Low priority or follow-up"

  - name: "risk:lockout"
    color: "B60205"
    description: "Can affect SSH/firewall access"
  - name: "risk:security"
    color: "D73A4A"
    description: "Security-sensitive behavior"
  - name: "risk:privacy"
    color: "D73A4A"
    description: "Sensitive diagnostic or personal/server data"
  - name: "risk:cross-platform"
    color: "1D76DB"
    description: "Windows/macOS/Linux compatibility risk"
  - name: "risk:destructive"
    color: "8B0000"
    description: "Destructive or difficult-to-recover operation"
  - name: "risk:real-vps-unverified"
    color: "E99695"
    description: "Blind-verified behavior awaiting Owner real-VPS evidence"
  - name: "risk:low"
    color: "C2E0C6"
    description: "Low-risk isolated change"

  - name: "evidence:e0-static"
    color: "D4C5F9"
    description: "Build/analyzer/format/supply-chain evidence"
  - name: "evidence:e1-unit"
    color: "C5DEF5"
    description: "Pure unit evidence"
  - name: "evidence:e2-simulated"
    color: "BFDADC"
    description: "Stateful simulation/fault-injection evidence"
  - name: "evidence:e3-local-protocol"
    color: "A2EEEF"
    description: "Contained local protocol integration evidence"
  - name: "evidence:e4-packaging"
    color: "FEF2C0"
    description: "Actual host build/package/startup evidence"
  - name: "evidence:e5-owner-vps"
    color: "FFD33D"
    description: "Owner-observed exact-candidate real-VPS evidence"
